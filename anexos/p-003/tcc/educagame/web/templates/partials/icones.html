{# Icones em SVG inline. Herdam a cor via currentColor e escalam com o
   container .mode-icon. Substituem os emojis, que renderizavam diferente
   em cada sistema operacional e ignoravam o tema. #}

{% macro icone(nome) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if nome == "jogar" -%}
    <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>
{%- elif nome == "enem" -%}
    <path d="M12 4.5 2.5 9 12 13.5 21.5 9 12 4.5Z"/><path d="M6.5 11.3V16c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-4.7"/><path d="M21.5 9v4.5"/>
{%- elif nome == "lab" -%}
    <path d="M9 3h6"/><path d="M10 3v6.2L4.6 18A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M7.5 15h9"/>
{%- elif nome == "oraculo" -%}
    <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3Z"/><path d="M18 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z"/>
{%- elif nome == "rpg" -%}
    <path d="M12 2 14 6.5V14h-4V6.5L12 2Z"/><path d="M7.5 14h9"/><path d="M12 14v4"/><path d="M9.5 20h5"/>
{%- elif nome == "escape" -%}
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/><path d="M12 14.5v2.5"/>
{%- elif nome == "boss" -%}
    <path d="M3 7l4 4 5-7 5 7 4-4-2 12H5L3 7Z"/><path d="M5 19h14"/>
{%- elif nome == "perfil" -%}
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif nome == "progresso" -%}
    <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
{%- elif nome == "guildas" -%}
    <path d="M12 2.5 20 6v6c0 4.6-3.3 8.4-8 9.5-4.7-1.1-8-4.9-8-9.5V6l8-3.5Z"/><path d="m9 12 2 2 4-4"/>
{%- elif nome == "professor" -%}
    <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4"/><path d="M8 20h8"/><path d="M7 8h6"/><path d="M7 11.5h4"/>
{%- elif nome == "troca" -%}
    <path d="M4 8h13"/><path d="m14 5 3 3-3 3"/><path d="M20 16H7"/><path d="m10 13-3 3 3 3"/>
{%- elif nome == "sol" -%}
    <circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4"/><path d="M12 19.8v2.4"/><path d="M4.8 4.8l1.7 1.7"/><path d="M17.5 17.5l1.7 1.7"/><path d="M1.8 12h2.4"/><path d="M19.8 12h2.4"/><path d="M4.8 19.2l1.7-1.7"/><path d="M17.5 6.5l1.7-1.7"/>
{%- elif nome == "lua" -%}
    <path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a7.6 7.6 0 1 0 11.3 11.3Z"/>
{%- elif nome == "admin" -%}
    <path d="M3 10 12 4l9 6"/><path d="M5 10v9"/><path d="M10 10v9"/><path d="M14 10v9"/><path d="M19 10v9"/><path d="M3 21h18"/>
{%- endif -%}
</svg>
{%- endmacro %}
